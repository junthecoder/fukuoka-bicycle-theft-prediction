[project]
name = "fukuoka-bicycle-theft-prediction"
version = "0.1.1"
description = "Predict Bicycle Thefts in Fukuoka"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
pipeline = "fukuoka_bicycle_theft_prediction.pipeline:main"
census-bbox = "fukuoka_bicycle_theft_prediction.census_bbox:main"
download-pmtiles = "fukuoka_bicycle_theft_prediction.download_pmtiles:main"
build-areas = "fukuoka_bicycle_theft_prediction.areas:main"
api = "fukuoka_bicycle_theft_prediction.api.app:main"
export-openapi = "fukuoka_bicycle_theft_prediction.api.export_openapi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fukuoka_bicycle_theft_prediction"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fukuoka_bicycle_theft_prediction", "fixtures"]
